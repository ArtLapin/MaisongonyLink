  <style>
    @font-face {
      font-family: 'DM Sans';
      font-style: normal;
      font-weight: 400 700;
      font-display: swap;
      src: url('assets/fonts/dmsans-latin.woff2') format('woff2');

    }
    @font-face {
      font-family: 'DM Sans';
      font-style: normal;
      font-weight: 400 700;
      font-display: swap;
      src: url('assets/fonts/dmsans-latin-ext.woff2') format('woff2');
      unicode-range: U+0100-02BA, U+02BD-02C5, U+02C7-02CC, U+02CE-02D7, U+02DD-02FF, U+0304, U+0308, U+0329, U+1D00-1DBF, U+1E00-1E9F, U+1EF2-1EFF, U+2020, U+20A0-20AB, U+20AD-20C0, U+2113, U+2C60-2C7F, U+A720-A7FF;
    }

    :root {
      --bg: #146DE1;
      --header-text: #fefbfb;
      --btn-bg: #ffffff;
      --btn-text: #0e0e0e;
      --btn-hover: #ededed;
      --btn-radius: 28px;
      --btn-inner-radius: 20px;
      --link-gap: 14px;
      --container-width: 580px;
      --focus-ring: 0 0 0 3px rgba(255, 255, 255, 0.7);
    }

    * { margin: 0; padding: 0; box-sizing: border-box; }

    html, body { height: 100%; }

    body {
      font-family: "DM Sans", "Inter", -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, "Apple SD Gothic Neo", "Malgun Gothic", sans-serif;
      background: var(--bg);
      color: var(--header-text);
      min-height: 100vh;
      min-height: 100svh;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 56px 16px 24px;
      -webkit-font-smoothing: antialiased;
      -moz-osx-font-smoothing: grayscale;
    }

    a, button { -webkit-tap-highlight-color: transparent; }
    :focus-visible { outline: none; box-shadow: var(--focus-ring); }

    /* Top-right share button */
    .topbar {
      position: fixed;
      top: 16px;
      right: 16px;
      z-index: 10;
    }
    .share-btn {
      width: 40px;
      height: 40px;
      border-radius: 50%;
      background: rgba(255, 255, 255, 0.85);
      border: none;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      color: #0e0e0e;
      transition: background 0.15s ease;
    }
    .share-btn:hover { background: #ffffff; }
    .share-btn svg { width: 20px; height: 20px; }

    /* Container */
    .container {
      width: 100%;
      max-width: var(--container-width);
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    /* Profile */
    .profile-img {
      width: 96px;
      height: 96px;
      border-radius: 50%;
      object-fit: cover;
      background: #ffffff;
      margin-bottom: 14px;
    }
    .username {
      font-size: 18px;
      font-weight: 700;
      color: var(--header-text);
      margin-bottom: 28px;
      letter-spacing: -0.01em;
    }

    /* Links */
    .links {
      width: 100%;
      display: flex;
      flex-direction: column;
      gap: var(--link-gap);
    }

    /* link-row wraps <a> + 3-dot <button> as siblings (valid HTML) */
    .link-row {
      position: relative;
      width: 100%;
    }

    .link-btn {
      display: flex;
      align-items: center;
      justify-content: center;
      width: 100%;
      min-height: 58px;
      padding: 14px 52px;
      background: var(--btn-bg);
      color: var(--btn-text);
      text-decoration: none;
      font-size: 15px;
      font-weight: 600;
      font-family: inherit;
      border: none;
      border-radius: var(--btn-radius);
      transition: transform 0.15s ease, background 0.15s ease;
      text-align: center;
    }
    .link-btn:hover { background: var(--btn-hover); transform: scale(1.01); }

    /* Per-link 3-dot share menu — sibling of <a>, not child */
    .link-more {
      position: absolute;
      right: 14px;
      top: 50%;
      transform: translateY(-50%);
      width: 32px;
      height: 32px;
      display: flex;
      align-items: center;
      justify-content: center;
      border: none;
      background: transparent;
      color: var(--btn-text);
      border-radius: 50%;
      cursor: pointer;
      transition: background 0.15s ease;
    }
    .link-more:hover { background: rgba(0, 0, 0, 0.08); }
    .link-more svg { width: 18px; height: 18px; }

    /* Card-style button (with image) */
    .link-card {
      padding: 8px 8px 0;
      flex-direction: column;
      min-height: 0;
      overflow: hidden;
    }
    .link-card .card-img {
      width: 100%;
      height: auto;
      aspect-ratio: 900 / 506;
      border-radius: var(--btn-inner-radius);
      object-fit: cover;
      display: block;
    }
    .link-card .card-footer {
      width: 100%;
      min-height: 58px;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 14px 52px;
      font-size: 15px;
      font-weight: 600;
    }
    .link-row--card .link-more {
      top: auto;
      bottom: 13px;
      transform: none;
    }

    /* Social icons row */
    .social-icons {
      margin-top: 26px;
      display: flex;
      justify-content: center;
      gap: 16px;
    }
    .social-icons a {
      width: 36px;
      height: 36px;
      display: flex;
      align-items: center;
      justify-content: center;
      color: var(--header-text);
      text-decoration: none;
      border-radius: 50%;
      transition: background 0.15s ease;
    }
    .social-icons a:hover { background: rgba(255, 255, 255, 0.12); }
    .social-icons svg { width: 24px; height: 24px; }

    /* Footer */
    .footer {
      margin-top: 36px;
      font-size: 12px;
      color: rgba(255, 255, 255, 0.7);
    }

    /* Desktop-only QR block (bottom-right) */
    .qr-block {
      display: none;
      position: fixed;
      right: 24px;
      bottom: 20px;
      flex-direction: column;
      align-items: center;
      gap: 8px;
      color: var(--header-text);
      font-size: 12px;
      font-weight: 500;
      z-index: 9;
      user-select: none;
    }
    .qr-block img {
      width: 120px;
      height: 120px;
      border-radius: 6px;
      background: #ffffff;
      padding: 6px;
      display: block;
    }
    @media (min-width: 1024px) {
      .qr-block { display: flex; }
    }

    /* Mobile */
    @media (max-width: 480px) {
      body { padding: 64px 16px 20px; }
      .username { font-size: 17px; margin-bottom: 24px; }
      .link-btn { font-size: 15px; min-height: 56px; }
      .link-card .card-footer { min-height: 56px; }
    }

    /* Toast for clipboard fallback */
    .toast {
      position: fixed;
      left: 50%;
      bottom: 32px;
      transform: translateX(-50%) translateY(20px);
      background: rgba(0, 0, 0, 0.85);
      color: #ffffff;
      padding: 10px 16px;
      border-radius: 999px;
      font-size: 13px;
      font-weight: 500;
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.2s ease, transform 0.2s ease;
      z-index: 100;
    }
    .toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }
  </style>
</head>
<body>

  <div class="toast" id="toast" role="status" aria-live="polite">링크가 복사되었습니다</div>

  <script>
    (function () {
      const toastEl = document.getElementById('toast');
      let toastTimer;
      function showToast(msg) {
        toastEl.textContent = msg;
        toastEl.classList.add('show');
        clearTimeout(toastTimer);
        toastTimer = setTimeout(() => toastEl.classList.remove('show'), 1800);
      }

      async function share(data) {
        if (navigator.share) {
          try {
            await navigator.share(data);
            return;
          } catch (err) {
            // User cancelled the share sheet — do nothing.
            if (err && err.name === 'AbortError') return;
            // Otherwise fall through to clipboard fallback.
          }
        }
        try {
          await navigator.clipboard.writeText(data.url);
          showToast('링크가 복사되었습니다');
        } catch (_) {
          showToast('공유에 실패했습니다');
        }
      }

      // Page share (top-right button)
      document.getElementById('sharePage').addEventListener('click', () => {
        share({ title: '@maisongony', text: 'MAISON GONY 공식 링크', url: location.href });
      });

      // Per-link share (3-dot menu sibling of <a>)
      document.querySelectorAll('.link-more').forEach((btn) => {
        btn.addEventListener('click', (e) => {
          e.preventDefault();
          e.stopPropagation();
          const url = btn.dataset.shareUrl;
          const title = btn.dataset.shareTitle || '@maisongony';
          if (!url) return;
          share({ title, url });
        });
      });
    })();
  </script>
